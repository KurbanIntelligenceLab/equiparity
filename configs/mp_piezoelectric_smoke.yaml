# Smoke config: MP piezoelectric (parity-odd tensor, the headline), tiny subset.
# Trains on non-centrosymmetric crystals; the runner also evaluates the OOD violation:
# O(3) predicts exact zero on centrosymmetric crystals, SO(3) predicts spurious nonzero.
seed: 42
core: nequip
parity: o3
target: piezoelectric
dataset: mp_piezoelectric
processed_npz: data/raw/mp/mp_piezoelectric_processed.npz
split_npz: data/splits/mp_piezoelectric_split.npz
output_dir: outputs
model:
  num_layers: 3
  l_max: 3
  num_features: 16
  r_max: 5.0
training:
  batch_size: 8
  epochs: 12
  lr: 0.003
  device: cuda
  max_train_samples: 300
  max_eval_samples: 120
