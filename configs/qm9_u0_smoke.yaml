# Smoke config: QM9 U0 control, tiny subset for a fast end-to-end run on the local GPU.
# Full-scale runs use the same schema without the max_*_samples caps and more epochs.
seed: 42
core: nequip
parity: o3
target: U0
dataset: qm9
processed_npz: data/raw/qm9/qm9_processed.npz
split_npz: data/splits/qm9_split.npz
output_dir: outputs
model:
  num_layers: 3
  l_max: 2
  num_features: 16
  r_max: 5.0
training:
  batch_size: 16
  epochs: 8
  lr: 0.005
  device: cuda
  max_train_samples: 400
  max_eval_samples: 150
