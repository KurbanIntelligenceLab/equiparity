# PRODUCTION config: MP piezoelectric with EquiformerV2 — the fixed SOTA SO(3) representative.
# EquiformerV2 is SO(3)-only (no parity), so it VIOLATES on centrosymmetric crystals: the OOD
# false-flag is the headline ("a deployed SO(3) model false-flags centrosymmetric crystals").
# parity is fixed so3. Runs float32 (native). num_features -> sphere_channels.
seed: 0
core: equiformer_v2
parity: so3
target: piezoelectric
dataset: mp_piezoelectric
processed_npz: data/raw/mp/mp_piezoelectric_processed.npz
split_npz: data/splits/mp_piezoelectric_split.npz
output_dir: outputs
model:
  num_layers: 4
  l_max: 3
  num_features: 64
  r_max: 5.0
training:
  batch_size: 8
  epochs: 150
  lr: 0.002
  device: cuda
  precision: float32
