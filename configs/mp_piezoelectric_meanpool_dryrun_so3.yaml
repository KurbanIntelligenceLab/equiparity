# Mean-pooling dry run, SO(3) arm: same as mp_piezoelectric_meanpool_dryrun.yaml but parity: so3,
# to sanity-check the false-flag signal survives mean pooling on the other arm too.
seed: 42
core: nequip
parity: so3
target: piezoelectric
dataset: mp_piezoelectric
processed_npz: data/raw/mp_dryrun/mp_piezoelectric_dryrun_processed.npz
split_npz: data/splits/mp_piezoelectric_dryrun_split.npz
output_dir: outputs
model:
  num_layers: 3
  l_max: 3
  num_features: 16
  r_max: 5.0
  pooling: mean
training:
  batch_size: 4
  epochs: 3
  lr: 0.003
  device: cpu
  precision: float32
