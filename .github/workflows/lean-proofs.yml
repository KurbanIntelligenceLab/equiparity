name: Lean proofs

on:
  push:
    branches: [main, 'codex/lean-parity-proofs']
    paths: ['proofs/**', '.github/workflows/lean-proofs.yml']
  pull_request:
    paths: ['proofs/**', '.github/workflows/lean-proofs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proofs
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Obtain pinned mathlib cache
        run: lake exe cache get
      - name: Build and audit all proofs
        run: python3 verify.py
