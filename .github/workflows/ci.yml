name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (base + nequip)
        run: uv sync --extra nequip
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (boundary, contract and CLI code)
        run: >-
          uv run mypy src/equiparity/domain src/equiparity/io src/equiparity/data
          src/equiparity/reproducibility.py src/equiparity/cli.py
          src/equiparity/workflows/grids.py src/equiparity/workflows/run_manifest.py
          src/equiparity/verification/parity_gap.py src/equiparity/verification/release.py

  verify:
    # The documented no-GPU path: base install plus the verify extra only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (base + verify)
        run: uv sync --extra verify
      - name: CLI smoke
        run: |
          uv run equiparity --version
          uv run equiparity records list --json > /dev/null
      - name: Release checks
        run: uv run equiparity verify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [nequip, mace]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (base + ${{ matrix.extra }} + release checks)
        run: uv sync --extra ${{ matrix.extra }} --extra verify
      - name: Pytest (unit, parity gate, and release checks)
        run: uv run pytest -q
