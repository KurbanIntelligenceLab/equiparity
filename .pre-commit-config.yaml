# Pre-commit runs ruff check, ruff format, and mypy.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy (boundary + contract code)
        entry: uv run mypy src/equiparity/domain src/equiparity/io src/equiparity/data src/equiparity/reproducibility.py
        language: system
        pass_filenames: false
        always_run: true
