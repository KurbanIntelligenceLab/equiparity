[project]
name = "equiparity"
version = "1.0.0"
description = "Code and measurement records for The parity gap in crystal tensor prediction"
requires-python = "==3.12.*"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Can Polat" },
  { name = "Mustafa Kurban", email = "kurbanm@ankara.edu.tr" },
  { name = "Erchin Serpedin" },
  { name = "Hasan Kurban", email = "hkurban@hbku.edu.qa" },
]
keywords = [
  "equivariant neural networks",
  "parity",
  "crystal symmetry",
  "piezoelectric tensor",
  "materials machine learning",
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
# Shared base: what training, data loading and the CLI need. The e3nn version is pinned by the
# model extras below (MACE e3nn==0.4.4 vs NequIP/Allegro e3nn>=0.6 conflict).
dependencies = [
  "numpy>=2.0",
  "torch>=2.11.0",
  "ase>=3.23",
  "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/KurbanIntelligenceLab/equiparity"
Archive = "https://doi.org/10.5281/zenodo.22003285"

[project.optional-dependencies]
# NequIP + Allegro family (e3nn 0.6.x). Install with: uv sync --extra nequip
nequip = [
  "nequip>=0.18.0",
  "nequip-allegro>=0.4",
  "torch-geometric>=2.5",
]
# MACE family (e3nn 0.4.4). Install with: uv sync --extra mace
mace = [
  "mace-torch>=0.3.16",
]
# Data preparation only (fetching/building datasets): `equiparity data prepare`.
data = [
  "spglib>=2.5",
  "pymatgen>=2025.1.1",
  "mp-api>=0.45",
]
# Aggregating a training-run tree into summary records: `equiparity aggregate`.
analysis = [
  "scipy>=1.13",
  "matplotlib>=3.9",
]
# Claim and theorem checkers: `equiparity verify`. Needs no GPU.
verify = [
  "numpy>=2.0",
  "sympy>=1.13",
]
[project.scripts]
equiparity = "equiparity.cli:main"

# MACE and NequIP/Allegro pin mutually-incompatible e3nn versions; declare the
# extras as conflicting so uv locks both and installs exactly one at a time.
[tool.uv]
conflicts = [
  [{ extra = "nequip" }, { extra = "mace" }],
]

# PyTorch from the CUDA 12.8 index on the platforms that index serves: required for
# RTX 5090 (Blackwell, sm_120). Training targets A100; the cu128 build also serves A100.
# macOS has no wheel there, so it resolves torch from the default index instead — which
# keeps `uv sync` and the verification extra working on a laptop.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equiparity"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.0",
  "pytest-cov",
  "hypothesis",
  "pre-commit>=3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Vendored model implementation within the package.
extend-exclude = [
  "src/equiparity/models/equiformer_v2",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ANN", "RUF", "SIM", "PTH", "RET"]

[tool.ruff.lint.per-file-ignores]
# Numerical aggregation code; loosely typed.
"src/equiparity/evaluation/aggregate.py" = ["ANN", "RUF001", "RUF002", "E501", "C408", "PTH", "SIM", "RET", "B", "N"]
"tests/verification/test_claims.py" = [
  "ANN", "RUF001", "N802", "N803", "N806", "N816", "E701", "E702", "E731", "E741",
  "PTH", "SIM115", "RET503",
]
"tests/verification/test_theory.py" = [
  "ANN", "RUF001", "N802", "N803", "N806", "N816", "E701", "E702", "E731", "E741",
  "PTH", "SIM115", "RET503",
]
"tests/verification/*" = ["ANN"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

# Strict typing for boundary and contract code.
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true

# Relaxed typing for numerical, featurization, and plotting code built on
# libraries with weak or missing stubs.
[[tool.mypy.overrides]]
module = [
  "equiparity.features.*",
  "equiparity.plotting.*",
  "equiparity.models.*",
  "equiparity.verification.*",
  "equiparity.training.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false

# Third-party ML/materials libraries: absent from the type-check env or shipping
# weak stubs. Treat their imports as untyped so boundary code stays install-agnostic.
[[tool.mypy.overrides]]
module = [
  "torch.*",
  "e3nn.*",
  "nequip.*",
  "allegro.*",
  "mace.*",
  "ase.*",
  "pymatgen.*",
  "spglib.*",
  "mp_api.*",
  "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src/equiparity"
markers = [
  "integration: integration tests",
  "smoke: end-to-end smoke tests",
  "gpu: requires GPU",
  "slow: slow tests",
]
